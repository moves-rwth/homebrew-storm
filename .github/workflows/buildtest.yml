name: Build Homebrew
# Builds and tests Storm's homebrew installation

on:
  # needed to trigger the workflow manually
  workflow_dispatch:
  pull_request:
  push:

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"

jobs:
  # Build Homebrew formula
  build:
    name: Build Tests (${{ matrix.config.name }}, ${{ matrix.config.buildType }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: "macOS 14, ARM",
             distro: "macos-14",
             buildType: "Release"
            }
          - {name: "macOS 15, ARM",
             distro: "macos-15",
             buildType: "Release"
            }
          - {name: "macOS 15, Intel",
             distro: "macos-15-intel",
             buildType: "Release"
            }
          - {name: "macOS 26, ARM",
             distro: "macos-26",
             buildType: "Release"
            }
          - {name: "macOS 26, Intel",
             distro: "macos-26-intel",
             buildType: "Release"
            }
    runs-on: ${{ matrix.config.distro }}
    steps:
      - name: Git clone
        uses: actions/checkout@v6
      - name: Update homebrew
        run: |
          brew update
          brew upgrade
      - name: Build Storm from Homebrew formula
        run: |
          brew install -v --build-from-source ./Formula/stormchecker.rb
      - name: Run Storm
        run: storm --version | grep 'with flags .* -O3'

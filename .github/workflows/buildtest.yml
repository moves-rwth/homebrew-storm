name: Build Homebrew
# Builds and tests Storm's homebrew installation

on:
  # needed to trigger the workflow manually
  workflow_dispatch:
  pull_request:
  push:

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"

jobs:
  # Build Homebrew formula
  build:
    name: Build Tests (${{ matrix.config.name }}, ${{ matrix.config.buildType }})
    strategy:
      matrix:
        config:
          - {name: "macOS 14, ARM",
             distro: "macos-14",
             buildType: "Release"
            }
          - {name: "macOS 15, ARM",
             distro: "macos-15",
             buildType: "Release"
            }
          - {name: "macOS 15, Intel",
             distro: "macos-15-intel",
             buildType: "Release"
            }
          - {name: "macOS 26, ARM",
             distro: "macos-26",
             buildType: "Release"
            }
          - {name: "macOS 26, Intel",
             distro: "macos-26-intel",
             buildType: "Release"
            }
    runs-on: ${{ matrix.config.distro }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Untap original repo
        run: brew untap moves-rwth/storm
      - name: Set up tap
        run: brew tap-new "local-tmp/storm"
      - name: Copy formula
        run: cp Formula/stormchecker.rb "$(brew --repo local-tmp/storm)/Formula/"
      - name: Audit formula
        run: brew audit --strict --new --online local-tmp/storm/stormchecker
      - name: Build Storm from Homebrew formula
        run: |
          brew install -v --build-from-source local-tmp/storm/stormchecker
      - name: Run test
        run: brew test local-tmp/storm/stormchecker
      - name: Run Storm
        run: storm --version
